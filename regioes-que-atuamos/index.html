<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regiões que atuamos · TSX Interações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Spline+Sans+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<style>
  /* ---------- Regiões de atuação ---------- */
  .regions {
    --ease: cubic-bezier(.22, 1, .36, 1);
    --uf: #484B4E;                  /* states with projects */
    --uf-active: #005073;
    background: var(--navy);
    overflow: hidden;
  }
  .regions__inner {
    position: relative;
    max-width: 1440px;
    min-height: 740px;
    margin-inline: auto;
    aspect-ratio: 1440 / 906;
  }
  /* Map: 911 × 906 slice of the 1440 frame, starting at x 440 */
  .regions__map {
    position: absolute;
    top: 0;
    left: 30.556%;
    width: 63.264%;
    height: 100%;
    overflow: visible;
  }
  .regions__bg path { fill: none; }
  .regions__bg .f, .regions__bg .fs { fill: #FFFFFF; fill-opacity: .1; }
  .regions__bg .s, .regions__bg .fs {
    stroke: #000000;
    stroke-width: 1.5;
    stroke-miterlimit: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .regions__states path { fill: var(--navy); stroke: #FFFFFF; stroke-width: 2.22; stroke-linejoin: round; }
  .regions__states .nf { stroke: none; }
  .regions__states .ns { fill: none; }
  .regions__states .regions__uf, .regions__uf .nf { fill: var(--uf); cursor: pointer; transition: fill .45s var(--ease); }
  .regions__states .regions__uf.is-active, .regions__uf.is-active .nf { fill: var(--uf-active); }
  .regions__pin { cursor: pointer; outline: none; }
  .regions__pin-shape {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transition: transform .5s cubic-bezier(.34, 1.56, .64, 1);
  }
  .regions__pin.is-active .regions__pin-shape { transform: translateY(-14px) scale(1.12); }
  .regions__pin-body { fill: #C89E5B; fill-rule: evenodd; }
  .regions__pin-dot { fill: #FFFFFF; }
  .regions__pin:focus-visible .regions__pin-body { stroke: #FFFFFF; stroke-width: 2; }

  .regions__card {
    position: absolute;
    z-index: 1;
    top: 80px;
    left: 64px;
    width: 457px;
    padding: 24px;
    border-radius: 4px;
    background: #F2F2F2;
  }
  .regions__title {
    margin: 8px 0 0;
    font-family: var(--font-2);
    font-weight: 500;
    font-size: 28px;
    line-height: 1.4;
    color: var(--ink);
  }
  /* Eyebrow (Figma: 2 × 14 bar, Caption/Default) */
  .regions__eyebrow { gap: 4px; font-weight: 600; }
  .regions__eyebrow::before {
    content: "";
    flex: none;
    width: 2px;
    height: 14px;
    border-radius: 4px;
    background: var(--rule);
  }
  /* Subcard motion, taken from the Lottie export (animacao card estados engineering.json):
     enter = top-down reveal + content zooming 120% → 100%; exit = clip collapsing upward
     + subcard zooming 100% → 120%. 0.64s each, cubic-bezier(.5, 0, 0, 1), no fade.
     JS animates the height between 0 and the subcard's height. */
  .regions__detail {
    --lottie: .64s cubic-bezier(.5, 0, 0, 1);
    height: 0;
    margin-top: 0;
    overflow: hidden;
    border-radius: 4px;
    transition: height var(--lottie), margin-top var(--lottie);
  }
  .regions.is-open .regions__detail { margin-top: 24px; }
  .regions__sub {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-radius: 4px;
    background: var(--card);
    transform: scale(1.2);
    transition: transform var(--lottie);
  }
  .regions.is-open .regions__sub { transform: none; }
  /* Frame 223 → 222: name, then the cities (one column, or two spaced across the row) */
  .regions__sub-head { display: flex; flex-direction: column; gap: 16px; padding-right: 64px; }
  .regions__uf-name {
    margin: 0;
    font-family: var(--font-2);
    font-weight: 500;
    font-size: 20px;
    line-height: 1.35;
    text-transform: uppercase;
    color: var(--ink);
  }
  .regions__cities { display: flex; justify-content: space-between; gap: 24px; }
  .regions__cities ul {
    margin: 0;
    padding: 0;
    list-style: none;
    font-family: var(--font-2);
    font-size: 18px;
    line-height: 1.5;
    color: #595753;
  }
  .regions__media {
    border-radius: 4px;
    overflow: hidden;
  }
  .regions__img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 377 / 173;
    object-fit: cover;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 39px), calc(100% - 34px) 100%, 0 100%);   /* Figma corner cut */
  }
  @media (max-width: 1279px) {
    .regions__map { left: auto; right: 0; }
  }
  @media (max-width: 900px) {
    /* the card slot reserves the tallest subcard so the page below never jumps */
    .regions__inner { min-height: 0; aspect-ratio: auto; padding: 32px 16px 48px; display: grid; grid-template-rows: auto minmax(620px, auto); align-items: start; }
    .regions__card { position: relative; top: auto; left: auto; width: auto; max-width: 457px; }
    .regions__map { position: relative; left: auto; right: auto; width: 100%; height: auto; aspect-ratio: 911 / 906; }
  }
  @media (max-width: 480px) {
    .regions__card { padding: 16px; }
    .regions__title { font-size: 24px; }
    .regions__sub-head { padding-right: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .regions__uf, .regions__uf .nf, .regions__pin-shape, .regions__detail, .regions__sub { transition: none; }
  }

</style>
</head>

    <div class="regions__card">
      <p class="eyebrow regions__eyebrow">Regiões que atuamos</p>
      <h2 class="regions__title" id="regions-title">Planejamos para transformar em diferentes regiões</h2>
      <div class="regions__detail" id="regions-detail">
        <div class="regions__sub">
          <div class="regions__sub-head">
            <h3 class="regions__uf-name"></h3>
            <div class="regions__cities"></div>
          </div>
          <div class="regions__media">
            <img class="regions__img" src="../assets/regiao-projeto.jpg" width="754" height="346" alt="" loading="lazy" decoding="async">
          </div>
        </div>
      </div>

<div class="demo-spacer" aria-hidden="true">Role para cima ↑ para ver a interação ao contrário</div>
<script>
(() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ---------- Regiões: states take turns on a loop; hover/focus on a state takes over ---------- */
  {
    const regions = document.querySelector('.regions');
    const REGIONS = {
      pa: { name: 'Pará', cities: ['Tucumã', 'Canaã dos Carajás'] },
      al: { name: 'Alagoas', cities: ['Craíbas'] },
      ba: { name: 'Bahia', cities: ['Caetité', 'Itagibá', 'Jaguari', 'Itagimirim'] },
      mg: { name: 'Minas Gerais', cities: ['Belo Horizonte', 'Araçuaí', 'Nova Lima', 'Mariana', 'Paraopeba', 'Itabira', 'Congonhas', 'Rio Piracicaba', 'Ponte Nova', 'Barão de Cocais'] },
      rj: { name: 'Rio de Janeiro', cities: ['Mangaratiba'] },
      es: { name: 'Espírito Santo', cities: ['Vitória'] },
      sp: { name: 'São Paulo', cities: ['São Paulo'] },
      go: { name: 'Goiás', cities: ['Goiânia', 'Alto Horizonte'] },
      mt: { name: 'Mato Grosso', cities: ['Lucas do Rio Verde'] },
    };
    const ORDER = Object.keys(REGIONS);
    // Timings from the Lottie: 0.64s in, 2s hold, 0.64s out
    const HOLD = 2640;   // ms from a state opening to it closing
    const GAP = 1300;    // ms from closing to the next state opening (0.64s exit + a beat with no subcard)
    const SWAP = 640;    // ms the subcard takes to close before reopening with another state (matches the CSS)
    const map = regions.querySelector('.regions__map');
    const detail = regions.querySelector('.regions__detail');
    const ufName = detail.querySelector('.regions__uf-name');
    const ufCities = detail.querySelector('.regions__cities');
    const ufImg = detail.querySelector('.regions__img');
    const sub = detail.querySelector('.regions__sub');
    // offsetHeight ignores the zoom transform, so this is the subcard's real height
    const fit = () => { detail.style.height = sub.offsetHeight + 'px'; };
    let current = null, index = 0, timer = 0, hovering = false, inView = false;
    let shown = null, hiddenAt = 0, swap = 0;   // shown = state whose data the subcard holds while open
    // Very light bounce on the white card's bottom edge as it settles (open: stretches past, close: dips past)
    const card = regions.querySelector('.regions__card');
    let bounceT = 0;
    function bounce(dir) {
      clearTimeout(bounceT);
      if (reduce.matches) return;
      bounceT = setTimeout(() => {
        const pb = parseFloat(getComputedStyle(card).paddingBottom);
        card.animate({ paddingBottom: [pb, pb + 6 * dir, pb - 2 * dir, pb].map(v => v + 'px'), offset: [0, .35, .7, 1] },
          { duration: 520, easing: 'ease-out' });
      }, 430);   // as the 0.64s height change is about to settle
    }

    for (const pin of map.querySelectorAll('.regions__pin')) {
      const r = REGIONS[pin.dataset.uf];
      pin.setAttribute('aria-label', r.name);
      pin.setAttribute('aria-controls', 'regions-detail');
    }

    const shapes = uf => map.querySelectorAll('[data-uf="' + uf + '"]');
    // Map look: state colour + raised pin
    function mark(uf) {
      if (current) shapes(current).forEach(el => el.classList.remove('is-active'));
      if (uf) shapes(uf).forEach(el => el.classList.add('is-active'));
      current = uf;
      if (uf) index = ORDER.indexOf(uf);
    }
    function show(uf) {
      const r = REGIONS[uf];
      ufName.textContent = r.name;
      // more than 5 cities → two columns (Figma Frame 209)
      const cols = r.cities.length > 5 ? [r.cities.slice(0, Math.ceil(r.cities.length / 2)), r.cities.slice(Math.ceil(r.cities.length / 2))] : [r.cities];
      ufCities.replaceChildren(...cols.map(col => {
        const ul = document.createElement('ul');
        ul.append(...col.map(c => Object.assign(document.createElement('li'), { textContent: c })));
        return ul;
      }));
      ufImg.alt = 'Projeto da TSX em ' + r.name;
      shown = uf;
      regions.classList.add('is-open');
      fit();
      bounce(1);
    }
    function hide() {
      if (!shown) return;
      shown = null;
      hiddenAt = performance.now();
      regions.classList.remove('is-open');
      detail.style.height = '0px';
      bounce(-1);
    }
    // Switching states: the open subcard closes first, then reopens with the new data
    function open(uf) {
      clearTimeout(swap);
      mark(uf);
      if (shown === uf) return;
      hide();
      const wait = SWAP - (performance.now() - hiddenAt);
      if (wait > 0 && !reduce.matches) swap = setTimeout(() => show(uf), wait);
      else show(uf);
    }
    function close() {
      clearTimeout(swap);
      mark(null);
      hide();
    }
    function advance() {
      close();
      timer = setTimeout(() => { index = (index + 1) % ORDER.length; step(); }, GAP);
    }
    function step() {
      open(ORDER[index]);
      timer = setTimeout(advance, HOLD);
    }
    // Picks the loop up again from wherever it stopped (the last hovered state keeps its turn)
    function resume() {
      clearTimeout(timer);
      if (hovering || !inView || reduce.matches) return;
      if (current) timer = setTimeout(advance, HOLD);
      else step();
    }
    function take(uf) {
      hovering = true;
      clearTimeout(timer);
      if (uf !== current) open(uf);
    }
    const ufOf = el => el?.closest?.('[data-uf]')?.dataset.uf;
    map.addEventListener('pointerover', e => { const uf = ufOf(e.target); if (uf) take(uf); });
    map.addEventListener('pointerout', e => {
      if (ufOf(e.target) && !ufOf(e.relatedTarget)) { hovering = false; resume(); }
    });
    map.addEventListener('focusin', e => { const uf = ufOf(e.target); if (uf) take(uf); });
    map.addEventListener('focusout', e => { if (!ufOf(e.relatedTarget)) { hovering = false; resume(); } });
    map.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && ufOf(e.target)) { e.preventDefault(); take(ufOf(e.target)); }
    });
    window.addEventListener('resize', () => { if (shown) fit(); });

    new IntersectionObserver(([entry]) => {
      inView = entry.isIntersecting;
      if (inView) resume();
      else clearTimeout(timer);
    }, { threshold: 0.3 }).observe(regions);

    // Reduced motion: no autoplay, one state stays open and hover still switches it
    function syncRegions() {
      if (reduce.matches) { clearTimeout(timer); if (!current) open(ORDER[index]); }
      else resume();
    }
    reduce.addEventListener?.('change', syncRegions);
    if (reduce.matches) open(ORDER[0]);
  }
})();
</script>
